global:
  scrape_interval: 15s               # how often to scrape targets
  evaluation_interval: 15s           # how often to evaluate rule expressions
  scrape_timeout: 10s                # timeout for each scrape request
  external_labels:                   # labels for federation/remote write
    environment: 'production'

# Rule files for recording and alerting rules
rule_files:
  - 'rules/*.yml'

scrape_configs:
  # Prometheus’s own metrics
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  # Grafana internal metrics
  - job_name: 'grafana'
    metrics_path: /metrics
    static_configs:
      - targets: ['grafana:3000']

  # cAdvisor - Container metrics with alias labels
  - job_name: 'cadvisor'
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'cadvisor:9109'
        labels:
          service: 'cadvisor'
    metric_relabel_configs:
      # cAdvisor (>= 0.49) no longer reliably exposes container_label_* metrics
      # on Docker hosts, so derive project + service from the image label
      # instead (version-agnostic, mirrors promtail).
      #   ghcr.io/tuke307/kds-api          -> project=kds,          service=api
      #   ghcr.io/tuke307/marienmuehle-web -> project=marienmuehle, service=web
      #   ghcr.io/tuke307/tonyluke-web     -> project=tonyluke,     service=web
      - source_labels: [image]
        regex: '^(?:.*\/)?(kds|marienmuehle|tonyluke)-(?:api|web|email-worker|db-migrate)([@:].*)?$'
        target_label: project
        replacement: '${1}'
      - source_labels: [image]
        regex: '^(?:.*\/)?(?:kds|marienmuehle|tonyluke)-(api|web|email-worker|db-migrate)([@:].*)?$'
        target_label: service
        replacement: '${1}'

  # Node Exporter - host metrics (CPU, RAM, disk, network, load).
  # Target is the in-stack service name, NOT localhost: the Prometheus container
  # can only reach other containers on the monitoring network.
  - job_name: 'node_exporter'
    static_configs:
      - targets:
          - 'node-exporter:9100'
        labels:
          service: 'node_exporter'

  # PostgreSQL exporter on each host
  - job_name: 'postgres_exporter'
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'localhost:9187'

  # Loki metrics (optional - for monitoring Loki itself)
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']

  # Promtail metrics (optional - for monitoring log collection)
  - job_name: 'promtail'
    static_configs:
      - targets:
          - 'localhost:9080'