server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  # Persisted on the `promtail-positions` volume (see docker-compose.yml) so
  # promtail does NOT re-read every container's full log history each time the
  # container is recreated. Re-reading history floods Loki with weeks-old
  # samples that get rejected with HTTP 400 ("timestamp too old") and stall
  # live ingestion behind the backlog.
  filename: /positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # ---------------------------------------------------------------------
  # All running Docker containers on the host.
  #
  # Promtail tails via the Docker socket, so it sees containers on EVERY
  # network (kds, marienmuehle, monitoring, ...) regardless of network
  # isolation between them. No per-app allowlist is needed.
  # ---------------------------------------------------------------------
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: status
            values: [running]
    relabel_configs:
      # --- identity labels ------------------------------------------------
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container_name'

      - source_labels: ['__meta_docker_container_id']
        regex: '([a-f0-9]{12}).*'
        target_label: 'container_id'

      - source_labels: ['__meta_docker_container_image']
        target_label: 'image'

      # --- project + service, derived from the image name -----------------
      # ghcr.io/tuke307/kds-api:latest       -> project=kds,          service=api
      # ghcr.io/tuke307/marienmuehle-web     -> project=marienmuehle,  service=web
      # ghcr.io/tuke307/tonyluke-web         -> project=tonyluke,      service=web
      # These power the per-project dashboards and avoid the Coolify
      # container-name suffixes (e.g. api-<uuid>-<n>) which collide
      # between projects that share service names.
      - source_labels: ['image']
        regex: '^.*\/(kds|marienmuehle|tonyluke)-(?:api|web|email-worker|db-migrate)(?::.*)?$'
        target_label: 'project'
        replacement: '${1}'

      - source_labels: ['image']
        regex: '^.*\/(?:kds|marienmuehle|tonyluke)-(api|web|email-worker|db-migrate)(?::.*)?$'
        target_label: 'service'
        replacement: '${1}'

      # --- best-effort Coolify labels (NOT required by the dashboards) ----
      # Casing matches the real Docker-SD meta labels (confirmed from the
      # running stack): coolify.serviceName / coolify.applicationName /
      # coolify.resourceName. Adjust here if a label stays empty.
      - source_labels: ['__meta_docker_container_label_coolify_applicationName']
        target_label: 'application'
      - source_labels: ['__meta_docker_container_label_coolify_resourceName']
        target_label: 'resource'
      - source_labels: ['__meta_docker_container_label_alias']
        target_label: 'alias'

      # --- static labels --------------------------------------------------
      - target_label: 'environment'
        replacement: 'production'
      - target_label: 'host'
        replacement: 'coolify-vps'

  # ---------------------------------------------------------------------
  # Optional: host system logs.
  # ---------------------------------------------------------------------
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/*log
