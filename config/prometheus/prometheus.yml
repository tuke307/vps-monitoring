global:
  scrape_interval: 15s               # how often to scrape targets
  evaluation_interval: 15s           # how often to evaluate rule expressions
  scrape_timeout: 10s                # timeout for each scrape request
  external_labels:                   # labels for federation/remote write
    environment: 'production'

# Rule files for recording and alerting rules
rule_files:
  - 'rules/*.yml'

scrape_configs:
  # Prometheus’s own metrics
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  # Grafana internal metrics
  - job_name: 'grafana'
    metrics_path: /metrics
    static_configs:
      - targets: ['grafana:3000']

  # cAdvisor - Container metrics with alias labels
  - job_name: 'cadvisor'
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'cadvisor:9109'
        labels:
          service: 'cadvisor'
    metric_relabel_configs:
      # Extract project from container name pattern (e.g., tuke307marienmuehlemain-servicename)
      # Matches everything before the last hyphen as the project name
      - source_labels: [name]
        regex: '^/?(.*)-[^-]+$'
        target_label: project
        replacement: '$1'
      
      # If no hyphen pattern, use the full name as both project and service
      - source_labels: [name, project]
        regex: '^/?([^-]+);$'
        target_label: project
        replacement: '$1'
      
      # Extract project/application name from Coolify labels (if available)
      - source_labels: [container_label_coolify_application_name]
        regex: (.+)
        target_label: project
      
      # 1) fallback: use Docker 'name' label for alias (extract service part after last hyphen)
      - source_labels: [name]
        regex: '^/?(?:.*-)?([^-/]+)$'
        target_label: alias
        replacement: '$1'

      # 2) if Coolify injected serviceName, overwrite alias
      - source_labels: [container_label_coolify_serviceName]
        regex: (.+)
        target_label: alias

      # 3) if you've added your own 'alias=' Docker label, that wins
      - source_labels: [container_label_alias]
        regex: (.+)
        target_label: alias

      # drop any metrics without an alias
      - source_labels: [alias]
        regex: ""
        action: drop

  # Node Exporter on each host
  - job_name: 'node_exporter'
    static_configs:
      - targets:
          - 'localhost:9208'
        labels:
          service: 'node_exporter'

  # PostgreSQL exporter on each host
  - job_name: 'postgres_exporter'
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'localhost:9187'

  # Loki metrics (optional - for monitoring Loki itself)
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']

  # Promtail metrics (optional - for monitoring log collection)
  - job_name: 'promtail'
    static_configs:
      - targets:
          - 'localhost:9080'