global:
  scrape_interval: 15s               # how often to scrape targets
  evaluation_interval: 15s           # how often to evaluate rule expressions
  scrape_timeout: 10s                # timeout for each scrape request
  external_labels:                   # labels for federation/remote write
    environment: 'production'

# Rule files for recording and alerting rules
rule_files:
  - 'rules/*.yml'

scrape_configs:
  # Prometheus’s own metrics
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  # Grafana internal metrics
  - job_name: 'grafana'
    metrics_path: /metrics
    static_configs:
      - targets: ['grafana:3000']

  # cAdvisor - Container metrics with alias labels
  - job_name: 'cadvisor'
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'cadvisor:9109'
        labels:
          service: 'cadvisor'
    metric_relabel_configs:
      # Extract Coolify project name (e.g., "tony-luke")
      - source_labels: [container_label_coolify_projectName]
        regex: (.+)
        target_label: project
      
      # Fallback: If no Coolify project, set to "unmanaged"
      - source_labels: [project]
        regex: ^$
        target_label: project
        replacement: 'unmanaged'
      
      # Extract Coolify resource name (e.g., "tuke307vps-monitoringmain") as application
      - source_labels: [container_label_coolify_resourceName]
        regex: (.+)
        target_label: application
      
      # Fallback: If no Coolify resourceName, use container name as application
      - source_labels: [application, name]
        regex: ';/?(.+)'
        target_label: application
        replacement: '$1'
      
      # Extract service name from container name (e.g., "prometheus" from "prometheus-t4480w404wkccw8gw84k08sk-214306365535")
      - source_labels: [name]
        regex: '^/?([^-]+)-.*'
        target_label: service
        replacement: '$1'
      
      # Fallback: If extraction failed, use full container name as service
      - source_labels: [service, name]
        regex: ';/?(.+)'
        target_label: service
        replacement: '$1'
      
      # Use service name as alias
      - source_labels: [service]
        target_label: alias

      # Override with custom alias label if present
      - source_labels: [container_label_alias]
        regex: (.+)
        target_label: alias

      # Drop any metrics without an alias
      - source_labels: [alias]
        regex: ""
        action: drop

  # Node Exporter on each host
  - job_name: 'node_exporter'
    static_configs:
      - targets:
          - 'localhost:9208'
        labels:
          service: 'node_exporter'

  # PostgreSQL exporter on each host
  - job_name: 'postgres_exporter'
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'localhost:9187'

  # Loki metrics (optional - for monitoring Loki itself)
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']

  # Promtail metrics (optional - for monitoring log collection)
  - job_name: 'promtail'
    static_configs:
      - targets:
          - 'localhost:9080'