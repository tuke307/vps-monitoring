services:
  # Prometheus - Metrics collection and storage
  prometheus:
    build:
      context: ./config/prometheus
      dockerfile: Dockerfile
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./config/prometheus/rules:/etc/prometheus/rules
    restart: unless-stopped
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # cAdvisor - Container metrics
  cadvisor:
    image: ghcr.io/google/cadvisor:0.56.1
    container_name: cadvisor
    ports:
      - "9109:9109"
    volumes:
      - /:/rootfs:ro
      # whole /var/run (not just docker.sock) so cAdvisor can reach the Docker
      # + containerd runtime sockets and register its docker factory
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - '-port=9109'
      - '--housekeeping_interval=15s'
      # project/service are derived from the image label in prometheus.yml, so
      # docker container labels aren't needed here (keeps cardinality low)
      - '--store_container_labels=false'
      - '--docker_only=true'
    devices:
      - /dev/kmsg
    privileged: true
    restart: unless-stopped
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9109/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Loki - Log aggregation system
  loki:
    image: grafana/loki:3.7.2
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./config/loki/loki.yml:/etc/loki/local-config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Alloy - Log collection (replaces the deprecated Promtail)
  alloy:
    image: grafana/alloy:v1.17.0
    container_name: alloy
    ports:
      - "12345:12345"
    volumes:
      - ./config/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # persistent positions so restarts resume instead of re-reading history
      - alloy-data:/var/lib/alloy/data
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    restart: unless-stopped
    networks:
      - monitoring
    depends_on:
      - loki

volumes:
  loki-data:
    driver: local
  prometheus-data:
    driver: local
  alloy-data:
    driver: local

networks:
  monitoring:
    driver: bridge
